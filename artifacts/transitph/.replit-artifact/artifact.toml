kind = "mobile"
previewPath = "/"
title = "TransitPH"
description = "A commuter-focused CALABARZON transit companion for finding jeepney routes, exploring terminals, checking local weather, and saving frequent journeys."
version = "1.0.0"
id = "artifacts/transitph"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18630

[services.development]
run = "pnpm --filter @workspace/transitph run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/transitph", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/transitph", "run", "serve" ]

[services.env]
PORT = "18630"
BASE_PATH = "/"
